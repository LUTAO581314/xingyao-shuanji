name: Windows candidate

on:
  pull_request:
    branches: [main, product-v2]
  push:
    branches: [main, product-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.8.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.14
      - name: Install product dependencies
        run: bun install --frozen-lockfile
      - name: Prepare fixed public engine source
        run: |
          $engineSource = Join-Path $env:RUNNER_TEMP 'xingyao-engine-source'
          bun run script/engine-source.ts prepare $engineSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "XINGYAO_ENGINE_SOURCE=$engineSource" >> $env:GITHUB_ENV
      - name: Build engine from complete patch queue
        run: |
          $env:PYTHON = (Get-Command python).Source
          bun run script/build-engine.ts $env:XINGYAO_ENGINE_SOURCE
      - name: Build product with matching provenance
        run: |
          $manifest = Get-Content patches/opencode/manifest.json -Raw | ConvertFrom-Json
          $engine = Join-Path $env:GITHUB_WORKSPACE "dist/engines/$($manifest.candidateBuild.version)"
          $env:XINGYAO_BUILD_ENGINE = Join-Path $engine 'opencode.exe'
          $env:XINGYAO_UPSTREAM_LICENSE = Join-Path $engine 'OPENCODE-LICENSE.txt'
          $env:XINGYAO_ENGINE_BUILD_RECORD = Join-Path $engine 'engine-build.json'
          bun run build
      - name: Verify real engine, recovery, compiled product and browser
        run: bun run script/verify-release.ts
      - name: Save passing candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-candidate-${{ github.sha }}
          path: |
            dist/xingyao-*/
            dist/engines/
          if-no-files-found: error
          retention-days: 14
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
